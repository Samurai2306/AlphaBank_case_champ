# VPS overlay for bot-project.ru — bind localhost only; reuse BOT host ports.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  api:
    ports: !override
      - "127.0.0.1:8100:8080"
    environment:
      CORS_ORIGINS: "https://bot-project.ru,https://www.bot-project.ru,https://glebcher23.fvds.ru"
      DEMO_OFFLINE: ${DEMO_OFFLINE:-0}
      DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
      HTTP_ADDR: ":8080"
      # Primary: OpenCode Zen free tier (RU-reachable, OpenAI-compatible).
      # Model rotation + optional fallback keep answers alive when one upstream flaps.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/v1}
      LLM_API_KEY: ${LLM_API_KEY:-public}
      LLM_PROVIDER: ${LLM_PROVIDER:-opencode-zen}
      LLM_MODEL: ${LLM_MODEL:-big-pickle}
      LLM_MODELS: ${LLM_MODELS:-big-pickle,mimo-v2.5-free,nemotron-3.5-lightning-free,ling-3.0-flash-fin-free}
      # Optional second provider (DeepSeek paid/free trial or Pollinations sk_ key).
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}

  web:
    ports: !override
      - "127.0.0.1:3100:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: "https://bot-project.ru/api/v1"
        NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
    environment:
      NEXT_PUBLIC_API_URL: "https://bot-project.ru/api/v1"
      NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
