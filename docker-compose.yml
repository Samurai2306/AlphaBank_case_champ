services:
  api:
    build: ./apps/api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
      DEMO_OFFLINE: ${DEMO_OFFLINE:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Browser calls host-mapped API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-demo-masha-token}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
